<!--
  Il portale di MangaVault, in versione francobollo: il torii di volumi
  al neon (02/11/2026), sul blu notte del sito. Il disegno grande, con
  l'alone, è `icona.svg`; qui i tratti sono più grossi — 2,3 invece di
  1,6 — perché a sedici pixel un tratto sottile diventa grigio, e l'alone
  a quella misura sarebbe solo una macchia.
-->
