name: Controlli
# A ogni push: il codice passa il lint e il sito si costruisce. Sono le
# due cose che Vercel scoprirebbe comunque, ma a pubblicazione già
# partita.
on:
  push:
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Il router non usa startTransition (serve al volo della copertina)
        run: npm run controlla
      - run: npm run build
